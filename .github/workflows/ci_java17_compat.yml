name: "CI :: Build (Java 17)"

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.event.pull_request && format('ci-java17-compat-pr-{0}', github.event.pull_request.number) || format('ci-java17-compat-push-main-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  build:
    name: "Java 17"
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 'SETUP :: Checkout'
        uses: actions/checkout@v7

      - name: 'SETUP :: Java 17'
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: 'BUILD :: Maven build'
        shell: bash
        run: |
          mvn -B -fae \
            -Dmaven.test.failure.ignore=false \
            -Dsurefire.failIfNoSpecifiedTests=false \
            clean install
